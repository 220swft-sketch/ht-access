<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HT Access</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #101414;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 480px;
    margin: auto;
}

h1 {
    color: #21C17C;
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

select, input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #444;
    background: #202727;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: #21C17C;
    color: #07130d;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.secondary {
    background: #303939;
    color: white;
}

button.override {
    background: #e0a72e;
    color: black;
}

button:disabled {
    opacity: 0.5;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.tabs button {
    flex: 1;
    font-size: 14px;
    background: #303939;
    color: white;
}

.tabs button.active {
    background: #21C17C;
    color: #07130d;
}

.panel {
    background: #1b2422;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
}

#reader {
    width: 100%;
    margin: 15px auto;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    background: #202727;
}

.player-name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
}

.colour {
    font-size: 25px;
    font-weight: bold;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
}

.WHITE { background: white; color: black; }
.BLACK { background: black; color: white; border: 1px solid #777; }
.GREEN { background: #21C17C; color: black; }
.VIP { background: #21C17C; color: black; }

.status {
    font-size: 18px;
    font-weight: bold;
    margin: 12px 0;
}

.small {
    color: #aaa;
    font-size: 13px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>HT ACCESS</h1>
    <div class="subtitle">HANDICAP TOUR EVENT ACCESS CONTROL</div>

    <div class="panel">

        <label>SELECT STATION</label>
        <select id="station">
            <option value="Entry">Entry</option>
            <option value="Drinks">Drinks</option>
            <option value="Halfway">Halfway</option>
        </select>

    </div>

    <div class="tabs">
        <button id="scanTab" class="active" onclick="showMode('scan')">
            SCAN QR CODE
        </button>

        <button id="manualTab" onclick="showMode('manual')">
            MANUAL CHECK-IN
        </button>
    </div>

    <!-- QR SCANNER -->

    <div id="scanMode" class="panel">

        <p>Scan the player's HT QR code.</p>

        <div id="reader"></div>

        <button class="secondary" onclick="startScanner()">
            START CAMERA
        </button>

    </div>

    <!-- MANUAL CHECK-IN -->

    <div id="manualMode" class="panel hidden">

        <p>For visitors without an HT QR code.</p>

        <label>IDENTIFICATION TYPE</label>

        <select id="identifierType">
            <option value="ID">ID Number</option>
            <option value="PHONE">Phone Number</option>
        </select>

        <input
            type="text"
            id="identifier"
            placeholder="Enter ID number or phone number"
        >

        <input
            type="text"
            id="fullName"
            placeholder="Enter full name and surname"
        >

        <button onclick="manualCheckin()">
            CHECK IN
        </button>

    </div>

    <!-- RESULT -->

    <div id="result">

        <div class="player-name" id="playerName"></div>

        <div id="category"></div>

        <div class="colour" id="wristband"></div>

        <div class="status" id="status"></div>

        <div id="overrideArea" class="hidden">

            <button class="override" onclick="confirmOverride()">
                OVERRIDE TO SUPPORTER – GREEN
            </button>

            <p class="small">
                Use only when authorised.
            </p>

        </div>

        <button onclick="resetScreen()">
            NEXT PERSON
        </button>

    </div>

    <p class="small">HANDICAP TOUR | HT ACCESS</p>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyEIwuWbCzAPJ6IsL8x4JjOC_WZOT99i-cq5-lhj4VyZ1H-7zSgy-N8BIU8zBkAOzA/exec";

let scanner = null;
let scannerRunning = false;
let activeIdentifier = "";
let activeStation = "";
let activeColour = "";
let activeCategory = "";

function showMode(mode) {

    stopScanner();

    document.getElementById("scanMode").classList.toggle("hidden", mode !== "scan");
    document.getElementById("manualMode").classList.toggle("hidden", mode !== "manual");

    document.getElementById("scanTab").classList.toggle("active", mode === "scan");
    document.getElementById("manualTab").classList.toggle("active", mode === "manual");

    document.getElementById("result").style.display = "none";

    if (mode === "scan") {
        startScanner();
    }
}

function startScanner() {

    if (scannerRunning) return;

    if (!scanner) {
        scanner = new Html5Qrcode("reader");
    }

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        function(decodedText) {
            stopScanner();
            processQR(decodedText);
        },
        function() {}
    ).then(() => {
        scannerRunning = true;
    }).catch(err => {
        alert("Camera could not start. Please check camera permissions.");
    });
}

function stopScanner() {

    if (scanner && scannerRunning) {
        scanner.stop().then(() => {
            scannerRunning = false;
        }).catch(() => {
            scannerRunning = false;
        });
    }
}

function processQR(qr) {

    activeIdentifier = qr;
    activeStation = document.getElementById("station").value;

    callBackend({
        action: "scan",
        qr: qr,
        station: activeStation
    });
}

function manualCheckin() {

    const type = document.getElementById("identifierType").value;
    const identifier = document.getElementById("identifier").value.trim();
    const name = document.getElementById("fullName").value.trim();

    if (!identifier) {
        alert("Please enter an ID number or phone number.");
        return;
    }

    if (!name) {
        alert("Please enter the person's full name and surname.");
        return;
    }

    activeIdentifier = identifier;
    activeStation = document.getElementById("station").value;

    callBackend({
        action: "manual",
        identifier: identifier,
        type: type,
        name: name,
        station: activeStation
    });
}

function callBackend(params) {

    document.getElementById("status").innerText = "PROCESSING...";

    const callbackName = "htCallback_" + Date.now();

    params.callback = callbackName;

    const query = new URLSearchParams(params).toString();

    const script = document.createElement("script");

    script.src = SCRIPT_URL + "?" + query;

    window[callbackName] = function(data) {

        displayResult(data);

        delete window[callbackName];
        script.remove();
    };

    script.onerror = function() {
        alert("Could not connect to HT Access. Please try again.");
        script.remove();
        delete window[callbackName];
    };

    document.body.appendChild(script);
}

function displayResult(data) {

    document.getElementById("result").style.display = "block";

    const name = data.name || data.playerName || "Unknown Player";
    const category = data.category || "HT Fan";
    const colour = String(
        data.colour || data.wristbandColour || "BLACK"
    ).toUpperCase();

    const status = String(data.status || data.message || "CHECK-IN COMPLETE");

    activeCategory = category;
    activeColour = colour;

    document.getElementById("playerName").innerText = name;
    document.getElementById("category").innerText = "CATEGORY: " + category;

    const band = document.getElementById("wristband");

    band.className = "colour " +
        (colour.includes("VIP") ? "VIP" : colour);

    band.innerText = "GIVE " + colour + " WRISTBAND";

    document.getElementById("status").innerText = status;

    const isBlack = colour.includes("BLACK");

    document.getElementById("overrideArea").classList.toggle(
        "hidden",
        !isBlack
    );
}

function confirmOverride() {

    if (!activeIdentifier || !activeStation) {
        alert("No check-in available to override.");
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to change this check-in to SUPPORTER – GREEN?"
    );

    if (!confirmed) return;

    callBackend({
        action: "override",
        identifier: activeIdentifier,
        station: activeStation
    });
}

function resetScreen() {

    document.getElementById("result").style.display = "none";

    document.getElementById("identifier").value = "";
    document.getElementById("fullName").value = "";

    activeIdentifier = "";
    activeStation = "";
    activeColour = "";
    activeCategory = "";

    if (!document.getElementById("manualMode").classList.contains("hidden")) {
        document.getElementById("identifier").focus();
    } else {
        startScanner();
    }
}

window.onload = function() {
    startScanner();
};

</script>

</body>
</html>
